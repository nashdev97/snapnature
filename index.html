<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapNature - Offline Nature Identifier</title>
    <meta name="description" content="Identify plants, animals, and nature with open-source AI. Get outside and explore!">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 SnapNature</h1>
            <p>Identify nature with open-source AI. Get outside and explore!</p>
        </header>

        <main>
            <section id="camera-section">
                <button id="capture-btn" class="btn-primary">
                    📸 Identify Nature
                </button>
                <video id="preview-video" playsinline></video>
                <canvas id="capture-canvas" style="display:none;"></canvas>
            </section>

            <section id="results-section" class="hidden">
                <h2>What did you find?</h2>
                <div id="result-image"></div>
                <div id="prediction">
                    <h3 id="species-name">Loading...</h3>
                    <p id="confidence">Confidence: --</p>
                </div>
                <div id="fun-facts">
                    <h3>Fun Facts</h3>
                    <p id="facts-text">Getting fun facts...</p>
                </div>
                <button id="save-btn" class="btn-secondary">Save to Journal</button>
            </section>

            <section id="journal-section" class="hidden">
                <h2>My Nature Journal</h2>
                <div id="journal-entries"></div>
                <button id="clear-journal" class="btn-warning">Clear Journal</button>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ for Hacktoberfest 2026 • Open-source AI</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
